<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: a strict allowlist of what the page may load.
      For a local desktop UI we only need our own bundled scripts/styles, so we
      forbid remote content. This is defense-in-depth against injected markup.

      `vipper-attachment:` is in img-src ONLY — that is the whole point of widening the
      policy by one token instead of registering the scheme with `bypassCSP`, which would
      have exempted it from script-src too. An attachment may be a picture; it may never
      be code.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: vipper-attachment:; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIPPER Task Manager</title>
  </head>
  <body>
    <!-- React mounts the whole UI into this single div (see src/main.tsx). -->
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
