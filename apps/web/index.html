<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>VIPPER Task Manager Cloud</title>
    <!-- SEMANTIC.light.canvas / SEMANTIC.dark.canvas (@tm/ui/tokens) — manifest.test.ts holds
         both metas to those values. A static <meta> can't read the resolved appearance
         setting, but it CAN read the OS's own light/dark media query, which is the one thing
         a browser chrome paints before this page's own script has run at all. The manifest's
         background_color/theme_color stay pinned to the light canvas (same file, below) since
         a .webmanifest has no media-query mechanism of its own. -->
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202326" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
