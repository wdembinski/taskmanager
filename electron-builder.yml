# electron-builder configuration — how the app is packaged into an installer.
# Windows: NSIS installer (`pnpm package`). Linux/Ubuntu: AppImage + .deb
# (`pnpm package:linux`, must run on Linux — e.g. WSL — so the native
# better-sqlite3 binary is compiled for Linux).
appId: network.vipper.claude-orchestrator
productName: Claude Orchestrator
copyright: © ${author}

directories:
  # electron-builder packages the compiled output produced by electron-vite build.
  output: dist
  buildResources: build # app icon lives at build/icon.ico

# What goes INSIDE the app bundle. electron-builder always adds the production
# dependency tree (so better-sqlite3 ships); these globs cover our own compiled code.
files:
  - out/**/*
  - package.json

# better-sqlite3 is a NATIVE module: its .node binary cannot be require()'d from
# inside the asar archive, so it must be unpacked to app.asar.unpacked. (The
# permission relay is materialized to userData at runtime, so it needs no unpack.)
asarUnpack:
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**'

win:
  target:
    - nsis
  icon: build/icon.ico
  # Windows may flag an unsigned exe; code-signing is a release-time concern (see
  # docs/07-packaging-and-release.md) and intentionally not configured here. The
  # publisher name is kept under signtoolOptions so it is used once a cert is added.
  signtoolOptions:
    publisherName: ${author}
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Orchestrator

linux:
  # AppImage runs on any modern distro; deb is the native Ubuntu/Debian package.
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  synopsis: Orchestrate the Claude CLI across many projects and tasks
  artifactName: ${productName}-${version}.${ext}

deb:
  # Debian requires a maintainer; electron-builder otherwise derives it from
  # the package.json author email (which is kept as a bare name for Windows'
  # ${author} interpolation), so it is set explicitly here.
  maintainer: Wojciech Dembinski <w.dembinski@live.com>
  # better-sqlite3 loads a native .node at runtime; libc/stdc++ are the only
  # system libs it needs beyond what Electron already depends on.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

# The Claude CLI/SDK is used from the user's own machine (their subscription login),
# so we do NOT bundle it — the app shells out to the `claude` already on PATH.
