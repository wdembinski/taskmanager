# pnpm 11 requires the build scripts of native deps to be explicitly approved,
# otherwise `pnpm install` exits non-zero and blocks `pnpm package`/`package:linux`.
# `allowBuilds` is the pnpm 11 form; `onlyBuiltDependencies` is kept for pnpm 10.
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
